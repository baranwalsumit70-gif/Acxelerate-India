<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Readiness Assessment · Acxelerate India (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ===== Tokens: shadcn/ui variable names, Acxelerate colours ===== */
:root{
  --background:#FFFFFF; --foreground:#1B2B3A; --card:#FFFFFF; --card-foreground:#1B2B3A;
  --muted:#F4F5F7; --muted-foreground:#5B6676; --border:#E3E6EB; --input:#7B8594;
  --primary:#1B2B3A; --primary-foreground:#FFFFFF; --primary-hover:#2A3F53;
  --accent:#C8961E; --accent-foreground:#1B2B3A; --accent-soft:#FBF3E2; --accent-ink:#7A5A0E;
  --ring:#1B2B3A; --ring-halo:#F2DFB3;
  --success:#15803D; --success-soft:#ECFDF3; --danger:#B42318; --danger-soft:#FEF3F2;
  --warning:#B54708; --warning-soft:#FEF4E6; --info-soft:#EEF4FF;
  --b-foundation:#B42318; --b-emerging:#B54708; --b-conditional:#8A6412; --b-ready:#15803D; --b-advanced:#0F766E;
  --track:#EAECEF; --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --font:'Geist','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --background:#0B1420; --foreground:#EEF2F6; --card:#111C2B; --card-foreground:#EEF2F6;
  --muted:#172334; --muted-foreground:#A6B1C0; --border:#24324A; --input:#7B8AA0;
  --primary:#E2B85A; --primary-foreground:#0B1420; --primary-hover:#EBC877;
  --accent:#E2B85A; --accent-foreground:#0B1420; --accent-soft:#2A2516; --accent-ink:#E8C77A;
  --ring:#E8C77A; --ring-halo:#3A3220;
  --success:#4ADE80; --success-soft:#0F2A1C; --danger:#F97066; --danger-soft:#2E1414;
  --warning:#FDB022; --warning-soft:#2E2210; --info-soft:#14213A;
  --b-foundation:#F97066; --b-emerging:#FDB022; --b-conditional:#E8C77A; --b-ready:#4ADE80; --b-advanced:#2DD4BF;
  --track:#24324A; --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --background:#0B1420; --foreground:#EEF2F6; --card:#111C2B; --card-foreground:#EEF2F6;
  --muted:#172334; --muted-foreground:#A6B1C0; --border:#24324A; --input:#7B8AA0;
  --primary:#E2B85A; --primary-foreground:#0B1420; --primary-hover:#EBC877;
  --accent:#E2B85A; --accent-foreground:#0B1420; --accent-soft:#2A2516; --accent-ink:#E8C77A;
  --ring:#E8C77A; --ring-halo:#3A3220;
  --success:#4ADE80; --success-soft:#0F2A1C; --danger:#F97066; --danger-soft:#2E1414;
  --warning:#FDB022; --warning-soft:#2E2210; --info-soft:#14213A;
  --b-foundation:#F97066; --b-emerging:#FDB022; --b-conditional:#E8C77A; --b-ready:#4ADE80; --b-advanced:#2DD4BF;
  --track:#24324A; --shadow:none;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{min-height:100%;background:var(--background);color:var(--foreground);font-family:var(--font);font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--background)}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;box-shadow:0 0 0 6px var(--ring-halo);border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--primary);color:var(--primary-foreground);padding:10px 14px;border-radius:8px;font-weight:600}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 12px)}

/* ===== Layout ===== */
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 20px}
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--background);border-bottom:1px solid var(--border)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;border-radius:8px}
.brand-logo{height:40px;width:auto;background:#fff;border-radius:6px;padding:2px 4px}
.brand-tag{font-size:13px;color:var(--muted-foreground);border-left:1px solid var(--border);padding-left:10px}
nav.top{display:flex;align-items:center;gap:4px}
@media (max-width:640px){.brand-tag,nav.top [data-go="home"],.tlabel{display:none}.brand-logo{height:34px}nav.top .btn-sm{padding:0 9px}.site-header .wrap{gap:6px}}
@media (min-width:641px){.ticon{display:none}}
main{min-height:calc(100vh - 68px - 160px);padding:32px 0 64px}
main:focus{outline:none}
.site-footer{border-top:1px solid var(--border);padding:28px 0 36px;font-size:14px;color:var(--muted-foreground)}
.site-footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between}
.site-footer a{color:var(--foreground)}

/* ===== Typography ===== */
h1{font-size:clamp(28px,4vw,40px);line-height:1.15;letter-spacing:-.02em;font-weight:700}
h2{font-size:22px;line-height:1.3;letter-spacing:-.01em;font-weight:650}
h3{font-size:17px;line-height:1.4;font-weight:600}
.lead{font-size:18px;color:var(--muted-foreground);max-width:680px}
.muted{color:var(--muted-foreground)} .small{font-size:14px} .xs{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ===== shadcn-style components ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius);border:1px solid transparent;font:600 15px/1 var(--font);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn-primary{background:var(--primary);color:var(--primary-foreground)} .btn-primary:hover{background:var(--primary-hover)}
.btn-accent{background:var(--accent);color:var(--accent-foreground)} .btn-accent:hover{filter:brightness(1.05)}
.btn-outline{background:var(--card);color:var(--foreground);border-color:var(--input)} .btn-outline:hover{background:var(--muted)}
.btn-ghost{background:transparent;color:var(--foreground)} .btn-ghost:hover{background:var(--muted)}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.btn-block{width:100%}
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.card-pad{padding:24px}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.b-neutral{background:var(--muted);color:var(--muted-foreground)}
.b-pass{background:var(--success-soft);color:var(--success)} .b-fail{background:var(--danger-soft);color:var(--danger)}
.b-unknown{background:var(--warning-soft);color:var(--warning)} .b-accent{background:var(--accent-soft);color:var(--accent-ink)}
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--muted);font-size:15px}
.alert-warn{background:var(--warning-soft);border-color:transparent} .alert-danger{background:var(--danger-soft);border-color:transparent} .alert-info{background:var(--info-soft);border-color:transparent} .alert-ok{background:var(--success-soft);border-color:transparent}
.alert .ico{flex:none;width:20px;height:20px;margin-top:2px}
.sep{height:1px;background:var(--border);border:0;margin:20px 0}

/* Form controls */
.field{display:flex;flex-direction:column;gap:6px}
.label{font-weight:600;font-size:15px}
.label .opt{font-weight:400;color:var(--muted-foreground)}
.hint{font-size:14px;color:var(--muted-foreground)}
.input,.select{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--input);border-radius:var(--radius);background:var(--card);color:var(--foreground);font:400 16px var(--font)}
.input[aria-invalid="true"],.select[aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.err{font-size:14px;color:var(--danger);font-weight:500;display:flex;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.otp{letter-spacing:.5em;font-size:22px;text-align:center;font-weight:600}
fieldset{border:0}
fieldset > legend{float:left;width:100%}
fieldset > legend + *{clear:both}
fieldset > legend ~ *{clear:both}
legend{font-weight:600}

/* Progress */
.progress{height:8px;background:var(--track);border-radius:999px;overflow:hidden}
.progress > span{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .3s}

/* Toast */
.toast-region{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px)}
.toast{background:var(--foreground);color:var(--background);padding:12px 16px;border-radius:12px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* ===== Home ===== */
.hero{padding:8px 0 28px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
@media (max-width:760px){.choice-grid{grid-template-columns:1fr}}
.choice{display:flex;flex-direction:column;gap:12px;padding:26px;border-radius:16px}
.choice .ic{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.org-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.org-grid{grid-template-columns:1fr}}
.org{padding:18px;border-radius:14px;border:1px dashed var(--border);color:var(--muted-foreground)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 20px;border-radius:14px;background:var(--accent-soft);border:1px solid transparent;margin-bottom:28px}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:how}
@media (max-width:860px){.how{grid-template-columns:1fr 1fr}} @media (max-width:520px){.how{grid-template-columns:1fr}}
.how li{list-style:none;padding:16px;border-radius:12px;background:var(--muted)}
.how li b{display:block;margin-bottom:4px}

/* ===== Home additions ===== */
.hero-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:32px;align-items:center}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.hero-art{max-width:380px}}
.hero-points{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:18px}
.hero-points li{position:relative;padding-left:18px}
.hero-points li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.group-h{font-size:18px;margin-bottom:12px}
.choice.compact{padding:20px;gap:10px}
.h-card{font-size:18px}
.org-grid .choice{height:100%}
.sec-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.weight{display:flex;align-items:center;gap:8px;flex:none}
.radar-wrap{display:flex;flex-direction:column;align-items:center;margin-top:8px}
.tabs{flex-wrap:wrap}
/* ===== Assessment ===== */
.assess{display:grid;grid-template-columns:260px 1fr;gap:36px;align-items:start}
@media (max-width:900px){.assess{grid-template-columns:1fr}.side{display:none}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}
.steps{list-style:none;display:flex;flex-direction:column;gap:2px;margin-top:12px}
.steps button{width:100%;display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;min-height:42px;padding:6px 10px;border-radius:10px;border:0;background:transparent;color:var(--muted-foreground);font:500 14px var(--font);text-align:left;cursor:pointer}
.steps button:hover{background:var(--muted)}
.steps .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--input);display:grid;place-items:center;font-size:12px;font-weight:700}
.steps .done .dot{background:var(--success);border-color:var(--success);color:#fff}
.steps [aria-current="step"]{background:var(--card);color:var(--foreground);font-weight:600;box-shadow:var(--shadow);border:1px solid var(--border)}
.steps [aria-current="step"] .dot{border-color:var(--primary);color:var(--foreground)}
.saved{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-foreground);margin-top:10px}
.qhead{margin-bottom:18px}
.mbar{display:none;gap:10px;align-items:center;margin-bottom:18px}
@media (max-width:900px){.mbar{display:flex}}
.qcard{padding:22px;border-radius:14px;margin-top:16px}
.qcard legend{font-size:17px;line-height:1.4;margin-bottom:4px;padding:0}
.qnum{display:inline-flex;width:28px;height:28px;border-radius:8px;background:var(--muted);align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-right:8px;vertical-align:1px}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media (max-width:640px){.scale{grid-template-columns:1fr}}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt label{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:64px;height:100%;padding:10px 12px;border:1px solid var(--input);border-radius:10px;background:var(--card);font-size:14px;line-height:1.3;cursor:pointer}
@media (max-width:640px){.opt label{min-height:48px;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px}}
.opt label b{font-weight:600}
.lvl-ico{flex:none;color:var(--foreground);margin-bottom:4px}
.opt input:checked + label .lvl-ico{color:var(--accent-ink)}
.opt .lvl{font-size:12px;color:var(--muted-foreground)}
.opt input:checked + label{border:2px solid var(--primary);background:var(--accent-soft);padding:9px 11px}
.opt input:checked + label::after{content:"✓";position:absolute;top:6px;right:9px;font-weight:700;color:var(--foreground);font-size:13px}
.opt input:focus-visible + label{outline:2px solid var(--ring);outline-offset:2px;box-shadow:0 0 0 6px var(--ring-halo)}
.chosen{margin-top:10px;font-size:14px;color:var(--muted-foreground);min-height:22px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media (max-width:640px){.checks{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:center;min-height:48px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;cursor:pointer;background:var(--card)}
.chk input{width:20px;height:20px;accent-color:var(--primary);flex:none}
.drop{margin-top:14px;padding:16px;border:1.5px dashed var(--input);border-radius:12px;background:var(--muted);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.files{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:10px}
.files li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--success-soft);font-size:14px}
.navbar{position:sticky;bottom:0;z-index:20;display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding:14px 0 calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--background);border-top:1px solid var(--border)}
.gate-q{padding:20px;border-radius:14px;margin-top:14px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
@media (max-width:520px){.seg3{grid-template-columns:1fr}}
.seg3 .opt label{min-height:48px;align-items:center;flex-direction:row;justify-content:center;font-weight:600}
.errsum{padding:16px;border:2px solid var(--danger);border-radius:12px;background:var(--danger-soft);margin-bottom:18px}
.errsum a{color:var(--danger);font-weight:600}

/* ===== Generating ===== */
.gen{display:grid;grid-template-columns:1.1fr 1fr;gap:28px}
@media (max-width:860px){.gen{grid-template-columns:1fr}}
.plist{list-style:none;display:flex;flex-direction:column;margin-top:18px}
.plist li{display:grid;grid-template-columns:30px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);align-items:start}
.pi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.pi.ok{background:var(--success);color:#fff} .pi.wait{border:2px solid var(--input)}
.pi.run{border:3px solid var(--track);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.refbox{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:var(--muted);margin-top:18px}
.refbox code{font:700 16px var(--font);letter-spacing:.02em}

/* ===== Report ===== */
.rep-head{background:#1B2B3A;color:#fff;border-radius:16px;padding:28px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end}
.rep-head p{color:#C9D2DD}
.rep-head .meta{font-size:14px;color:#C9D2DD;text-align:right}
.rep-head .meta b{color:#fff}
.rep-top{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:18px;margin-top:18px}
@media (max-width:960px){.rep-top{grid-template-columns:1fr}}
.score-line{display:flex;align-items:center;gap:16px}
.ring{flex:none}
.big{font-size:56px;font-weight:700;line-height:1;letter-spacing:-.03em}
.band{display:inline-flex;align-items:center;min-height:28px;padding:2px 12px;border-radius:999px;font-weight:700;font-size:14px;color:#fff}
:root[data-theme="dark"] .band{color:#0B1420}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .band{color:#0B1420}}
.scale-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin-top:22px}
.scale-wrap{position:relative}
.marker{position:absolute;top:-20px;transform:translateX(-50%);font-size:12px;font-weight:700}
.marker::after{content:"";display:block;width:2px;height:28px;background:var(--foreground);margin:2px auto 0}
.scale-lbl{display:flex;font-size:12px;color:var(--muted-foreground);margin-top:6px}
.ledger{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.lrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 14px;background:var(--muted);font-size:15px}
.lrow + .lrow{border-top:1px dashed var(--input)}
.lrow b{font-size:18px}
.lrow.total{background:var(--card);border-top:2px solid var(--foreground)}
.lrow.total b{font-size:24px}
.neg{color:var(--warning)}
.lnote{padding:10px 14px;background:var(--accent-soft);font-size:14px;border-top:1px solid var(--border)}
.gate{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:15px}
.gate:last-of-type{border-bottom:0}
.rep-body{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;margin-top:24px}
@media (max-width:960px){.rep-body{grid-template-columns:1fr}}
.dim{border-bottom:1px solid var(--border)}
.dim summary{list-style:none;display:grid;grid-template-columns:minmax(120px,190px) 1fr 44px 22px;gap:12px;align-items:center;min-height:52px;padding:6px 4px;cursor:pointer;border-radius:8px}
.dim summary::-webkit-details-marker{display:none}
.dim summary:hover{background:var(--muted)}
.dim .chev{transition:transform .2s;color:var(--muted-foreground)}
.dim[open] .chev{transform:rotate(90deg)}
.dname{font-size:15px;font-weight:600;line-height:1.3}
.dname small{display:block;font-weight:400;font-size:13px;color:var(--muted-foreground)}
.track{height:10px;background:var(--track);border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px}
.dscore{font-weight:700;text-align:right;font-size:16px}
.ddetail{padding:6px 4px 18px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.qa{padding:10px 12px;border-radius:10px;background:var(--muted)}
.qa b{display:block;font-weight:500;color:var(--muted-foreground);font-size:13px;margin-bottom:2px}
.action{display:grid;grid-template-columns:4px 1fr auto;gap:14px;padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.action .bar{border-radius:4px}
.pts{font-weight:700;color:var(--success);white-space:nowrap}
.ai{border-radius:14px;padding:22px;background:var(--accent-soft)}
.ai p{margin-top:8px}
.skeleton{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--track),var(--muted),var(--track));background-size:200% 100%;animation:sh 1.4s infinite;margin-top:10px}
@keyframes sh{to{background-position:-200% 0}}
details.how-score{margin-top:24px}
details.how-score summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}

/* ===== Reports page ===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{padding:16px;border-radius:12px;border:1px solid var(--border);background:var(--card)}
.kpi span{font-size:13px;color:var(--muted-foreground)}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;margin-top:2px}
.kpi em{font-style:normal;font-size:13px;font-weight:600;color:var(--success)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:13px;color:var(--muted-foreground);font-weight:600;padding:8px 6px;border-bottom:2px solid var(--foreground)}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--border)}
.tbl .n{text-align:right;font-weight:600}
.tbl tbody th{border-bottom:1px solid var(--border);font-size:15px;color:var(--foreground);padding:10px 6px}
.tbl-wrap{overflow-x:auto}
.rlist{display:flex;flex-direction:column;gap:10px}
.ritem{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--card)}
.chart-wrap{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:14px;color:var(--muted-foreground);margin-top:8px}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--muted)}
.tabs button{min-height:38px;padding:0 14px;border-radius:9px;border:0;background:transparent;font:600 14px var(--font);color:var(--muted-foreground);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--foreground);box-shadow:var(--shadow)}
dialog{border:1px solid var(--border);border-radius:16px;padding:0;background:var(--card);color:var(--foreground);max-width:min(92vw,520px);margin:auto}
dialog::backdrop{background:rgba(11,20,32,.55)}
@media print{.site-header,.site-footer,.no-print,.navbar{display:none!important} main{padding:0} .card{box-shadow:none}}
</style>

const blankStore=()=>({user:{email:null,verified:false},drafts:{student:null,professional:null,startup:null,msme:null,university:null},reports:[],theme:null});
let S=blankStore(); let view='home'; let ctx={};
let db=null, assets=null, downloads=null, sample=null, storeKind='device';
const DOC='data/users/me/app';
let saveTimer=null, saving=false, saveAgain=false;
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const r=$('#toasts');const t=document.createElement('div');t.className='toast';t.textContent=msg;r.appendChild(t);setTimeout(()=>t.remove(),4200);}
function migrate(){Object.keys(S.drafts||{}).forEach(t=>{const d=S.drafts[t];if(d&&d.levels!==4){Object.keys(d.answers).forEach(k=>{d.answers[k]=d.answers[k].map(v=>v==null?null:[0,1,1,2,3][v]);});d.levels=4;}});['startup','msme','university'].forEach(t=>{if(!(t in S.drafts))S.drafts[t]=null;});}
function loadLocal(){try{const raw=localStorage.getItem('acx-proto-v1');if(raw)S=Object.assign(blankStore(),JSON.parse(raw));}catch(e){} migrate();}
function saveLocal(){try{localStorage.setItem('acx-proto-v1',JSON.stringify(S));}catch(e){}}
function persist(){clearTimeout(saveTimer);setSaved('saving');saveTimer=setTimeout(flush,700);}
async function flush(){
  if(saving){saveAgain=true;return;}
  saving=true; saveLocal();
  if(db){try{await db.doc(DOC).set(JSON.parse(JSON.stringify(S)));}catch(e){ if(e&&e.code==='quota_exceeded') toast('Storage is full. Delete an old report to keep saving.'); }}
  saving=false; setSaved('saved');
  if(saveAgain){saveAgain=false;flush();}
}
function setSaved(st){const el=$('#savedNote');if(!el)return;el.textContent=st==='saving'?'Saving…':'All changes saved'+(storeKind==='account'?' to your account':' on this device');}
async function initCaps(){
  if(!window.claude||!window.claude.use) return;
  try{ db=await window.claude.use('db'); }catch(e){db=null;}
  if(db){ try{ const snap=await db.doc(DOC).get(); if(snap.exists){ S=Object.assign(blankStore(),snap.data()); migrate(); } else { await db.doc(DOC).set(JSON.parse(JSON.stringify(S))); } storeKind='account'; render(); }catch(e){ db=null; } }
  try{ sample=await window.claude.use('sample'); }catch(e){}
  try{ assets=await window.claude.use('assets'); }catch(e){}
  try{ downloads=await window.claude.use('downloads'); }catch(e){}
}

/* ========== Scoring (assumptions are documented in "How scoring works") ========== */
function bandFor(score){let b=BANDS[0];for(const x of BANDS) if(score>=x.min) b=x; return b;}
function compute(d){
  const T=TYPES[d.type]; const sec={}; let raw=0, conf=0;
  for(const s of T.sections){
    const a=(d.answers&&d.answers[s.id])||[]; const vals=a.filter(v=>v!=null);
    const sc=vals.length? vals.reduce((x,y)=>x+y,0)/vals.length/lvMax(d)*100 : 0;
    sec[s.id]=sc; raw+=s.w*sc/100;
    const verified=(d.docs&&d.docs[s.id]&&d.docs[s.id].length>0);
    conf+=s.w*(verified?1:0.5)/100;
  }
  const factor=0.7+0.3*conf; const R=Math.round(raw); const F=Math.round(raw*factor);
  const gates=T.gates.map((g,i)=>{const v=d.gates?d.gates[i]:null;return {...g,status:v==='yes'?'pass':v==='no'?'fail':v==='unsure'?'unknown':'missing'};});
  let band=bandFor(F), capped=false;
  if(gates.some(g=>g.cap&&g.status==='fail') && BANDS.indexOf(band)>1){band=BANDS[1];capped=true;}
  const blocked=new Set(gates.filter(g=>g.sec&&g.status!=='pass').map(g=>g.sec));
  const ordered=T.sections.map(s=>({...s,score:sec[s.id],pts:+(s.w*(100-sec[s.id])/100*factor).toFixed(1),verified:!!(d.docs&&d.docs[s.id]&&d.docs[s.id].length)}));
  const scores=ordered.map(s=>s.score); const even=(Math.max(...scores)-Math.min(...scores))<5;
  let strengths=[], gaps=[];
  if(!even){
    strengths=ordered.filter(s=>s.score>=60&&!blocked.has(s.id)).sort((a,b)=>b.score-a.score).slice(0,3);
    gaps=ordered.filter(s=>s.score<60).sort((a,b)=>b.pts-a.pts).slice(0,3);
    if(!gaps.length) gaps=[...ordered].sort((a,b)=>b.pts-a.pts).slice(0,2);
  } else { gaps=[...ordered].sort((a,b)=>b.w-a.w).slice(0,3); }
  const fails=gates.filter(g=>g.status==='fail'), unknown=gates.filter(g=>g.status==='unknown'||g.status==='missing');
  let next;
  if(fails.length) next={state:'blocked',title:'Not yet: a mandatory check isn’t met',text:fails[0].no};
  else if(unknown.length) next={state:'confirm',title:'Not yet: confirm your mandatory checks',text:`Confirm ${unknown.map(g=>g.name.toLowerCase()).join(' and ')} to unlock country matching.`};
  else if(F>=60) next={state:'ready',title:'You can move on to country matching',text:'All checks have passed and your verified score is in the Conditional band or above.'};
  else next={state:'build',title:'Not yet: build your score to 60',text:`All checks have passed. Reach 60 (Conditional) to unlock country matching. You need ${60-F} more points.`};
  return {sec,ordered,raw,R,F,conf,factor,deduct:R-F,band,capped,gates,strengths,gaps,even,next,recover:Math.round(raw)-F};
}
const answeredCount=d=>TYPES[d.type].sections.reduce((n,s)=>n+((d.answers[s.id]||[]).filter(v=>v!=null).length),0);
function newDraft(type){
  const T=TYPES[type]; const answers={},evidence={},docs={};
  T.sections.forEach(s=>{answers[s.id]=[null,null,null,null];evidence[s.id]=[];docs[s.id]=[];});
  const profile={}; PROFILE[type].forEach(f=>{if(f.def)profile[f.id]=f.def;});
  return {type,levels:4,step:0,profile,answers,evidence,docs,gates:[null,null,null,null],startedAt:Date.now(),updatedAt:Date.now()};
}

const gateBadge=st=>st==='pass'?'<span class="badge b-pass">✓ Passed</span>':st==='fail'?'<span class="badge b-fail">✕ Not met</span>':st==='unknown'?'<span class="badge b-unknown">? Not sure yet</span>':'<span class="badge b-neutral">Not answered</span>';
const bandChip=b=>`<span class="band" style="background:var(--b-${b.key})">${esc(b.name)}</span>`;
const fmtDate=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const first=n=>(String(n||'').trim().split(/\s+/)[0])||'there';
function ring(score,band,size=104){const r=size/2-8,c=2*Math.PI*r,off=c*(1-score/100);
 return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="10"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--b-${band.key})" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;}
function lvlBars(level,max){return `<svg class="lvl-ico" width="34" height="22" viewBox="0 0 34 22" aria-hidden="true">${Array.from({length:max},(_,i)=>`<rect x="${i*9}" y="${16-i*5}" width="6.5" height="${6+i*5}" rx="1.5" fill="${i<=level?'currentColor':'var(--track)'}"/>`).join('')}</svg>`;}
function donut(pct,size=56){const r=size/2-6,c=2*Math.PI*r;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="8"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-dasharray="${(c*pct/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="currentColor">${pct}%</text></svg>`;}
function radar(c){const W=560,H=320,n=c.ordered.length,cx=W/2,cy=H/2,R=96;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100];};
 const rings=[25,50,75,100].map(v=>`<polygon points="${c.ordered.map((_,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="var(--border)"/>`).join('');
 const spokes=c.ordered.map((_,i)=>{const [x,y]=pt(i,100);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border)"/>`;}).join('');
 const bench=`<polygon points="${c.ordered.map((_,i)=>pt(i,60).join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
 const shape=`<polygon points="${c.ordered.map((s,i)=>pt(i,s.score).join(',')).join(' ')}" fill="var(--foreground)" fill-opacity=".14" stroke="var(--foreground)" stroke-width="2"/>`;
 const dots=c.ordered.map((s,i)=>{const [x,y]=pt(i,s.score);return `<circle cx="${x}" cy="${y}" r="4" fill="var(--b-${bandFor(Math.round(s.score)).key})" stroke="var(--card)" stroke-width="1.5"/>`;}).join('');
 const labels=c.ordered.map((s,i)=>{const [x,y]=pt(i,113);const anchor=Math.abs(x-cx)<8?'middle':x>cx?'start':'end';const dy=Math.abs(x-cx)<8?(y<cy?-6:12):4;return `<text x="${x}" y="${y+dy}" text-anchor="${anchor}" font-size="12" fill="var(--muted-foreground)">${esc(s.name)} <tspan font-weight="700" fill="var(--foreground)">${Math.round(s.score)}</tspan></text>`;}).join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;font-family:var(--font)" role="img" aria-label="Radar chart of section scores: ${esc(c.ordered.map(s=>s.name+' '+Math.round(s.score)).join(', '))}. Dashed line marks 60, the Conditional band.">${rings}${spokes}${bench}${shape}${dots}${labels}</svg>`;}
function scaleBar(score){return `<div class="scale-wrap" aria-hidden="true"><div class="marker" style="left:${Math.min(98,Math.max(2,score))}%">${score}</div><div class="scale-bar"><span style="width:40%;background:var(--b-foundation)"></span><span style="width:20%;background:var(--b-emerging)"></span><span style="width:15%;background:var(--b-conditional)"></span><span style="width:15%;background:var(--b-ready)"></span><span style="width:10%;background:var(--b-advanced)"></span></div></div><div class="scale-lbl" aria-hidden="true"><span style="width:40%">0</span><span style="width:20%">40</span><span style="width:15%">60</span><span style="width:15%">75</span><span style="width:10%">90</span></div>`;}

function stepName(t,i){return i===0?'Your profile':i===9?'Final checks':TYPES[t].sections[i-1].name;}
function stepDone(d,i){ if(i===0) return PROFILE[d.type].every(f=>!f.req||String(d.profile[f.id]||'').trim()); if(i===9) return d.gates.every(v=>v); return d.answers[TYPES[d.type].sections[i-1].id].every(v=>v!=null);}
V.assess=()=>{
  if(!S.drafts[ctx.type]) return V.home();
  const t=ctx.type, d=S.drafts[t], T=TYPES[t], step=d.step;
  const left=32-answeredCount(d); const mins=Math.max(1,Math.round(left*0.35));
  const pct=Math.round((answeredCount(d)+d.gates.filter(Boolean).length)/36*100);
  const steps=Array.from({length:10},(_,i)=>`<li><button data-act="goto" data-step="${i}" class="${stepDone(d,i)?'done':''}" ${i===step?'aria-current="step"':''}><span class="dot">${stepDone(d,i)?'✓':i+1}</span><span>${esc(stepName(t,i))}</span><span class="sr-only">${stepDone(d,i)?', complete':''}</span></button></li>`).join('');
  let body='';
  if(step===0) body=profileStep(d); else if(step===9) body=gatesStep(d); else body=sectionStep(d,T.sections[step-1]);
  return `<div class="wrap"><div class="assess">
   <aside class="side" aria-label="Assessment progress"><h2 style="font-size:16px">${T.label} assessment</h2><p class="xs muted">${pct}% complete · about ${mins} min left</p><div class="progress" style="margin-top:10px" role="progressbar" aria-label="Assessment progress" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div><ol class="steps">${steps}</ol><p class="saved" id="savedNote" aria-live="polite">All changes saved${storeKind==='account'?' to your account':' on this device'}</p></aside>
   <section aria-labelledby="stepTitle"><div class="mbar"><span class="small" style="white-space:nowrap">Step ${step+1} of 10</span><div class="progress" style="flex:1"><span style="width:${pct}%"></span></div><span class="xs muted" style="white-space:nowrap">~${mins} min left</span></div>
   ${ctx.errors&&ctx.errors.length?`<div class="errsum" role="alert" tabindex="-1" id="errsum"><h2 style="font-size:17px">Please fix ${ctx.errors.length===1?'this':'these'} before continuing</h2><ul style="margin:8px 0 0 18px">${ctx.errors.map(e=>`<li><a href="#${e.id}" data-focus="${e.id}">${esc(e.msg)}</a></li>`).join('')}</ul></div>`:''}

function fieldErr(id){const e=(ctx.errors||[]).find(x=>x.id===id);return e?e.msg:null;}
function profileStep(d){
  const fields=PROFILE[d.type].map(f=>{const v=d.profile[f.id]||'';const er=fieldErr('f-'+f.id);const desc=[f.hint?`h-${f.id}`:'',er?`e-${f.id}`:''].filter(Boolean).join(' ');
   const lab=`${esc(f.label)}${f.req?'':' <span class="opt">(optional)</span>'}`;
   if(f.type==='radio') return `<fieldset class="field" id="f-${f.id}" ${desc?`aria-describedby="${desc}"`:''}><legend class="label">${lab}</legend>${f.hint?`<p class="hint" id="h-${f.id}">${esc(f.hint)}</p>`:''}<div class="seg3">${f.opts.map((o,i)=>`<div class="opt"><input type="radio" name="p-${f.id}" id="p-${f.id}-${i}" value="${esc(o)}" data-profile="${f.id}" ${v===o?'checked':''}><label for="p-${f.id}-${i}">${esc(o)}</label></div>`).join('')}</div>${er?`<p class="err" id="e-${f.id}">${esc(er)}</p>`:''}</fieldset>`;
   const common=`id="f-${f.id}" data-profile="${f.id}" ${f.req?'required aria-required="true"':''} ${er?'aria-invalid="true"':''} ${desc?`aria-describedby="${desc}"`:''}`;
   const ctl=f.type==='select'?`<select class="select" ${common}><option value="">Select…</option>${f.opts.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input class="input" type="${f.type}" ${f.ac?`autocomplete="${f.ac}"`:''} ${f.type==='number'?`inputmode="numeric" min="${f.min}" max="${f.max}"`:''} value="${esc(v)}" ${common}>`;

function gatesStep(d){

   ${v==='no'?`<p class="alert alert-warn small" style="margin-top:12px">${I.warn}<span>${esc(g.no)}</span></p>`:''}${er?`<p class="err">${esc(er)}</p>`:''}</fieldset>`;}).join('')}`;

   ${[0,40,60,75,90].map(v=>`<text x="${x0-26}" y="${y(v)+4}" fill="var(--muted-foreground)" text-anchor="end">${v}</text>`).join('')}
   ${n>1?`<polygon points="${poly}" fill="var(--accent)" opacity=".22"/>`:''}
   <polyline points="${pr}" fill="none" stroke="var(--foreground)" stroke-width="2" stroke-dasharray="6 5"/>
   <polyline points="${pf}" fill="none" stroke="var(--foreground)" stroke-width="3"/>
   ${cs.map((c,i)=>`<circle cx="${xs[i]}" cy="${y(c.R)}" r="4.5" fill="var(--card)" stroke="var(--foreground)" stroke-width="2"/><circle cx="${xs[i]}" cy="${y(c.F)}" r="5.5" fill="var(--foreground)"/><text x="${xs[i]}" y="${y(c.R)-10}" text-anchor="middle" fill="var(--muted-foreground)">${c.R}</text><text x="${xs[i]}" y="${y(c.F)+20}" text-anchor="middle" font-weight="700" fill="var(--foreground)">${c.F}</text><text x="${xs[i]}" y="${H-8}" text-anchor="middle" fill="var(--muted-foreground)">${new Date(list[i].createdAt).toLocaleDateString('en-GB',{month:'short',year:'2-digit'})}</text>`).join('')}</svg>`;

/* ========== AI analysis ========== */
function templateAI(r,c){
  const n=first(r.profile[TYPES[r.type].nameKey||'name']);
  let s=`${n}, your readiness score is ${c.F}, in the ${c.band.name} band. `;
  if(c.even) s+='Your sections are even, so no single strength or gap stands out. ';
  else if(c.strengths[0]) s+=`Your strongest area is ${c.strengths[0].name.toLowerCase()} (${Math.round(c.strengths[0].score)}). `;
  if(c.gaps[0]) s+=`The biggest opportunity is ${c.gaps[0].name.toLowerCase()}, worth up to ${c.gaps[0].pts} points. `;
  s+=c.next.text;
  return {summary:s,strengths:c.strengths.slice(0,2).map(x=>({section:x.id,why:''})),
   actions:c.gaps.map(g=>{const low=Math.min(...r.answers[g.id]);const qi=r.answers[g.id].indexOf(low);const doc=g.docs.find(x=>!(r.evidence[g.id]||[]).includes(x))||g.docs[0];
    return {section:g.id,title:`Strengthen your ${g.name.toLowerCase()}`,why:`Your lowest answer here was “${optsFor(r,qi)[low][0]}”.`,document:doc};})};
}
async function runAI(r){
  const c=compute(r); r.aiState='running';
  if(!sample){r.ai=templateAI(r,c);r.aiState='template';persist();rerenderIf(r.id);return;}
  const data={type:r.type,firstName:first(r.profile[TYPES[r.type].nameKey||'name']),organisation:TYPES[r.type].org?r.profile.name:undefined,profile:Object.fromEntries(Object.entries(r.profile).filter(([k])=>!['mobile','name','contact','email'].includes(k))),
   readinessScore:c.F,scoreFromAnswers:c.R,band:c.band.name,mandatoryChecks:c.gates.map(g=>({name:g.name,status:g.status})),nextStep:c.next.text,
   sections:c.ordered.map(s=>({id:s.id,name:s.name,weight:s.w,score:Math.round(s.score),answers:r.answers[s.id].map((v,i)=>SCALES[i].kind+': '+optsFor(r,i)[v][0]+' (level '+(v+1)+' of '+(lvMax(r)+1)+')'),documentsUserSaysTheyHave:r.evidence[s.id]||[],documentList:s.docs})),
   allowedStrengthIds:c.strengths.map(s=>s.id),gapIdsInOrder:c.gaps.map(s=>s.id),sectionsAreEven:c.even};
  const prompt=`You write the short personal analysis in a ${TYPES[r.type].label} global-readiness report for Acxelerate India.
Rules: use ONLY the data below. Never invent numbers, schools, employers, countries, scholarships or statistics. Never recommend a country. Never call a section a strength unless its id is in allowedStrengthIds. Do not contradict the mandatory checks or nextStep. Address the person by first name. Plain UK English, warm and direct, no jargon, no exclamation marks.
Return ONLY a JSON object: {"summary": string (at most 60 words, mention the readiness score and band), "strengths": [{"section": id from allowedStrengthIds, "why": string at most 22 words}] (0 to 2 items), "actions": [{"section": id, "title": string of at most 7 words starting with a verb, "why": string at most 24 words that refers to their actual answers, "document": one exact item from that section's documentList}] with exactly one action per id in gapIdsInOrder, in that order}.
DATA: ${JSON.stringify(data)}`;
  try{
    const out=await sample.json(prompt,{modelTier:'default'});
    const ok=out&&typeof out.summary==='string';
    if(!ok) throw new Error('bad');
    const allowed=new Set(c.strengths.map(s=>s.id));
    const acts=(Array.isArray(out.actions)?out.actions:[]).filter(a=>c.gaps.some(g=>g.id===a.section)&&a.title&&a.why);
    const tmpl=templateAI(r,c);
    r.ai={summary:String(out.summary).slice(0,600),strengths:(Array.isArray(out.strengths)?out.strengths:[]).filter(s=>allowed.has(s.section)).slice(0,2),
      actions:c.gaps.map(g=>{const a=acts.find(x=>x.section===g.id);const t=tmpl.actions.find(x=>x.section===g.id);if(!a)return t;return {section:g.id,title:String(a.title).slice(0,80),why:String(a.why).slice(0,220),document:g.docs.includes(a.document)?a.document:t.document};})};
    r.aiState='ai';
  }catch(e){ r.ai=templateAI(r,c); r.aiState='template'; }
  persist(); rerenderIf(r.id);
  if(view==='generating') toast(r.aiState==='ai'?'Your analysis is ready.':'Your report is ready.');
}
function rerenderIf(id){ if((view==='generating'||view==='report')&&ctx.id===id){ const y=window.scrollY; render(false); window.scrollTo(0,y);} }

async function makePDF(r){
  const btn=document.querySelector('[data-act="pdf"]'); if(btn){btn.textContent='Preparing PDF…';btn.setAttribute('aria-disabled','true');}
  try{
    const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'pt',format:'a4'}); const c=compute(r), T=TYPES[r.type];
    const BC={foundation:[180,35,24],emerging:[181,71,8],conditional:[138,100,18],ready:[21,128,61],advanced:[15,118,110]};
    let y=40; doc.addImage(LOGO,'PNG',40,y,130,51); doc.setFontSize(9);doc.setTextColor(91,102,118);doc.text(`Reference ${r.id}`,555,y+14,{align:'right'});doc.text(fmtDate(r.createdAt),555,y+28,{align:'right'});
    y+=82; doc.setTextColor(27,43,58);doc.setFont('helvetica','bold');doc.setFontSize(20);doc.text(T.title,40,y);
    y+=18; doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(91,102,118);doc.text(`Prepared for ${r.profile.name||''}`,40,y);
    y+=30; doc.setFontSize(40);doc.setFont('helvetica','bold');doc.setTextColor(...BC[c.band.key]);doc.text(String(c.F),40,y+8);
    doc.setFontSize(14);doc.text(c.band.name,110,y-6);doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(27,43,58);doc.text(c.band.meaning,110,y+10);
    y+=34; doc.setFontSize(10);[[`Score from your answers`,String(c.R)],[`Not yet backed by documents (${Math.round(c.conf*100)}% verified)`,c.deduct>0?'-'+c.deduct:'0'],['Readiness score',String(c.F)]].forEach(([a,b],i)=>{doc.setFont('helvetica',i===2?'bold':'normal');doc.text(a,40,y);doc.text(b,300,y,{align:'right'});y+=15;});
    y+=8; doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Mandatory checks',40,y);y+=16;doc.setFontSize(10);
    c.gates.forEach(g=>{doc.setFont('helvetica','normal');doc.text(g.name,40,y);const s=g.status==='pass'?'Passed':g.status==='fail'?'Not met':'Not sure yet';doc.setFont('helvetica','bold');doc.text(s,300,y,{align:'right'});y+=14;});
    doc.setFont('helvetica','normal');const nx=doc.splitTextToSize(`${c.next.title}. ${c.next.text}`,515);doc.text(nx,40,y+4);y+=nx.length*13+18;
    doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Where you stand',40,y);y+=16;doc.setFontSize(10);
    [...c.ordered].sort((a,b)=>b.score-a.score).forEach(s=>{const sc=Math.round(s.score),b=bandFor(sc);doc.setFont('helvetica','normal');doc.setTextColor(27,43,58);doc.text(`${s.name} (${s.w}%)`,40,y);doc.setFillColor(234,236,239);doc.rect(220,y-8,260,8,'F');doc.setFillColor(...BC[b.key]);doc.rect(220,y-8,2.6*sc,8,'F');doc.setFont('helvetica','bold');doc.text(String(sc),510,y,{align:'right'});y+=17;});
    y+=8; doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('What to fix first',40,y);y+=16;doc.setFontSize(10);
    const ai=r.ai||templateAI(r,c);
    ai.actions.forEach((a,i)=>{const s=c.ordered.find(x=>x.id===a.section);doc.setFont('helvetica','bold');doc.text(`${i+1}. ${a.title}  (up to +${s?s.pts:0} points, ${[30,60,90][i]} days)`,40,y);y+=13;doc.setFont('helvetica','normal');const w=doc.splitTextToSize(`${a.why} Document: ${a.document}.`,505);doc.text(w,52,y);y+=w.length*13+6;});
    y+=6; doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('Your personal analysis',40,y);y+=16;doc.setFont('helvetica','normal');doc.setFontSize(10);const sm=doc.splitTextToSize(ai.summary,515);doc.text(sm,40,y);y+=sm.length*13;
    doc.setFontSize(8);doc.setTextColor(91,102,118);doc.text('Scores come from your own answers. Documents you add raise the verified share. Acxelerate India · readiness.acxelerateindia.com',40,815);
    const data=doc.output('arraybuffer'); const filename=`Acxelerate-${r.id}.pdf`;
    if(downloads){ try{ const res=await downloads.save({filename,data}); if(res&&res.status==='saved') toast('PDF saved.'); }catch(e){ if(e&&e.code==='unavailable'){window.print();} else if(e&&e.code!=='declined'&&e.code!=='cancelled') toast('The PDF could not be saved. Try again.'); } }
    else { doc.save(filename); toast('PDF downloaded.'); }
  }catch(e){ toast('The PDF could not be created. Using print view instead.'); window.print(); }
  finally{ if(btn){btn.textContent='Download PDF';btn.removeAttribute('aria-disabled');} }
}

/* ========== Render and navigation ========== */
function render(focus=true){
  document.documentElement.toggleAttribute('data-theme',!!S.theme); if(S.theme) document.documentElement.setAttribute('data-theme',S.theme);
  $('#themeBtn').innerHTML=`<span class="tlabel">${isDark()?'Light mode':'Dark mode'}</span><span class="ticon" aria-hidden="true">${isDark()?'☀':'☾'}</span>`; $('#themeBtn').setAttribute('aria-pressed',String(isDark())); $('#themeBtn').setAttribute('aria-label','Dark mode');
  $('#authSlot').innerHTML=S.user.verified?`<button class="btn btn-ghost btn-sm" data-act="signout" title="Signed in as ${esc(S.user.email)}">Sign out</button>`:`<button class="btn btn-outline btn-sm" data-act="signinNav">Sign in</button>`;
  document.querySelectorAll('nav.top [data-go]').forEach(b=>b.toggleAttribute('aria-current',false));
  const cur=document.querySelector(`nav.top [data-go="${view==='report'?'reports':view}"]`); if(cur) cur.setAttribute('aria-current','page');
  $('#main').innerHTML=(V[view]||V.home)();
  const titles={home:'Assessments',signin:'Sign in',assess:'Assessment',generating:'Preparing your report',report:'Your report',reports:'My reports',privacy:'Privacy'};
  document.title=`${titles[view]||'Assessments'} · Acxelerate India Global Readiness`;
  if(focus){ const es=$('#errsum'); if(es){es.focus();} else { const h=$('#stepTitle')||$('#main h1'); if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});} window.scrollTo(0,0);} }
}
function isDark(){return S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;}
function go(v,c={}){view=v;ctx=c;render();}
function needAuth(next){ if(S.user.verified) return true; go('signin',{signStep:'email',next}); return false; }
function startType(type,fresh){
  if(!needAuth({start:type,fresh})) return;
  if(fresh||!S.drafts[type]) S.drafts[type]=newDraft(type);
  persist(); go('assess',{type});
}

/* ========== Validation ========== */
function validate(d){
  const errs=[];
  if(d.step===0) PROFILE[d.type].forEach(f=>{const v=String(d.profile[f.id]||'').trim();
    if(f.req&&!v) errs.push({id:'f-'+f.id,msg:`Enter your ${f.label.toLowerCase().replace('are you interested in starting a business?','answer')}`});
    else if(f.type==='number'&&v&&(isNaN(+v)||+v<f.min||+v>f.max)) errs.push({id:'f-'+f.id,msg:`${f.label} must be a number from ${f.min} to ${f.max}`});
    else if(f.type==='tel'&&v&&!/^[+\d][\d\s-]{6,16}$/.test(v)) errs.push({id:'f-'+f.id,msg:'Enter a valid mobile number, or leave it empty'});
    if(f.type==='radio'&&f.req&&!v) errs[errs.length-1].msg=`Answer: ${f.label}`;});
  else if(d.step>=1&&d.step<=8){const s=TYPES[d.type].sections[d.step-1];d.answers[s.id].forEach((v,i)=>{if(v==null)errs.push({id:`q-${s.id}-${i}`,msg:`Answer question ${i+1}: ${SCALES[i].q(s)}`});});}
  else if(d.step===9){d.gates.forEach((v,i)=>{if(!v)errs.push({id:'g-'+i,msg:`Answer: ${TYPES[d.type].gates[i].name}`});});
    for(let i=0;i<9;i++) if(!stepDone(d,i)) errs.push({id:'step-'+i,msg:`Finish “${stepName(d.type,i)}” first`,step:i});}
  return errs;
}

/* ========== Reports ========== */
function makeId(code){const a=new Uint32Array(2);crypto.getRandomValues(a);return `${code}-${(a[0]%900000+100000)}-${(a[1]%9000+1000)}`;}
function submit(d){
  const r={id:makeId(TYPES[d.type].code),type:d.type,levels:d.levels||5,createdAt:Date.now(),profile:{...d.profile,email:S.user.email},answers:JSON.parse(JSON.stringify(d.answers)),evidence:JSON.parse(JSON.stringify(d.evidence)),docs:JSON.parse(JSON.stringify(d.docs)),gates:[...d.gates],aiState:'running'};
  S.reports.push(r); S.drafts[d.type]=null; persist(); go('generating',{id:r.id}); runAI(r);
}
function addSample(type){
  const base=seriesFor(type).filter(r=>!r.sample).pop(); if(!base){toast('Finish one assessment first.');return;}
  [180,90].forEach((days,k)=>{const drop=k===0?2:1;const r=JSON.parse(JSON.stringify(base));r.id=makeId(TYPES[type].code);r.sample=true;r.createdAt=base.createdAt-days*864e5;
    Object.keys(r.answers).forEach((sid,j)=>{r.answers[sid]=r.answers[sid].map(v=>Math.max(0,v-(k===0?1:(j%2===0?1:0))));r.docs[sid]=(k===0||j%2)?[]:r.docs[sid];});
    if(k===0) r.gates=r.gates.map((g,i)=>i===1||i===2?'unsure':g); r.ai=null;r.aiState='template'; S.reports.push(r);});
  persist(); toast('Sample history added. It’s marked as sample.'); render(false);
}

/* ========== Uploads ========== */
async function handleUpload(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const sid=input.dataset.upload, where=input.dataset.where;
  if(file.size>5*1024*1024){toast('That file is over 5 MB. Choose a smaller file.');input.value='';return;}
  if(!/\.(pdf|jpe?g|png)$/i.test(file.name)){toast('Use a PDF, JPG or PNG file.');input.value='';return;}
  let id=null; if(assets){ try{ const res=await assets.upload(file); id=res.id; }catch(e){} }
  const entry={name:file.name,size:file.size,id,addedAt:Date.now()};
  if(where==='draft'){ const d=S.drafts[ctx.type]; (d.docs[sid]=d.docs[sid]||[]).push(entry); persist(); render(false); toast(`${file.name} added.`); }
  else { const r=S.reports.find(x=>x.id===ctx.id); const before=compute(r).F; (r.docs[sid]=r.docs[sid]||[]).push(entry); const after=compute(r).F; persist(); const y=scrollY; render(false); scrollTo(0,y);
    toast(after>before?`Document added. Your readiness score went from ${before} to ${after}.`:`Document added.`); }
}

/* ========== Confirm dialog (native confirm() is blocked in some frames) ========== */
function ask(title,text,okLabel){return new Promise(res=>{const dlg=document.createElement('dialog');dlg.setAttribute('aria-labelledby','dlgT');dlg.setAttribute('aria-describedby','dlgD');
 dlg.innerHTML=`<div class="card-pad stack"><h2 id="dlgT" style="font-size:20px">${esc(title)}</h2><p id="dlgD" class="muted">${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn btn-outline" value="no">Cancel</button><button class="btn btn-danger" value="yes">${esc(okLabel)}</button></div></div>`;
 document.body.appendChild(dlg);const done=v=>{dlg.close();dlg.remove();res(v);};dlg.addEventListener('click',ev=>{const b=ev.target.closest('button');if(b)done(b.value==='yes');});dlg.addEventListener('cancel',ev=>{ev.preventDefault();done(false);});dlg.showModal();dlg.querySelector('button').focus();});}

/* ========== Events ========== */
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const st=e.target.closest('[data-start]'); if(st){ startType(st.dataset.start); return; }
  const f=e.target.closest('[data-focus]'); if(f){ e.preventDefault(); const id=f.dataset.focus; if(id.startsWith('step-')){S.drafts[ctx.type].step=+id.slice(5);ctx.errors=null;persist();render();return;} const el=document.getElementById(id); if(el){ const inp=el.matches('input,select')?el:el.querySelector('input,select'); el.scrollIntoView({block:'center'}); (inp||el).focus(); } return; }
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act;
  if(a.getAttribute('aria-disabled')==='true') return;
  const d=ctx.type?S.drafts[ctx.type]:null;
  switch(act){
    case 'resume': if(needAuth({start:a.dataset.type})) go('assess',{type:a.dataset.type}); break;
    case 'restart': if(await ask('Start again?','Your saved answers for this assessment will be cleared.','Start again')) startType(a.dataset.type,true); break;
    case 'signinNav': go('signin',{signStep:'email'}); break;
    case 'signout': S.user={email:null,verified:false}; persist(); toast('Signed out. Your reports stay saved.'); go('home'); break;
    case 'resend': ctx.code=String(Math.floor(100000+Math.random()*900000)); ctx.err=null; render(); toast('New code sent (simulated).'); break;
    case 'changeEmail': go('signin',{signStep:'email',email:ctx.email,next:ctx.next}); break;
    case 'goto': d.step=+a.dataset.step; ctx.errors=null; persist(); render(); break;
    case 'back': if(d.step>0){d.step--;ctx.errors=null;persist();render();} break;
    case 'next': { const errs=validate(d); if(errs.length){ctx.errors=errs;render();return;} ctx.errors=null; if(d.step===9){submit(d);return;} d.step++; d.updatedAt=Date.now(); persist(); render(); break; }
    case 'rmdoc': d.docs[a.dataset.sec].splice(+a.dataset.i,1); persist(); render(false); toast('Document removed.'); break;
    case 'copy': try{await navigator.clipboard.writeText(a.dataset.text);toast('Reference copied.');}catch(_){toast('Select the reference and copy it.');} break;
    case 'openReport': go('report',{id:a.dataset.id}); break;
    case 'email': toast(`A copy was sent to ${S.user.email||'your email'} (simulated).`); break;
    case 'pdf': { const r=S.reports.find(x=>x.id===a.dataset.id); if(r) makePDF(r); break; }
    case 'retake': startType(a.dataset.type,true); break;
    case 'tab': ctx.tab=a.dataset.tab; render(false); document.getElementById('tab-'+ctx.tab).focus(); break;
    case 'delReport': if(await ask('Delete this report?','This can’t be undone.','Delete report')){ S.reports=S.reports.filter(r=>r.id!==a.dataset.id); persist(); render(false); toast('Report deleted.'); } break;
    case 'sample': addSample(a.dataset.type); break;
    case 'unsample': S.reports=S.reports.filter(r=>!(r.sample&&r.type===a.dataset.type)); persist(); render(false); toast('Sample history removed.'); break;
  }
});
document.addEventListener('keydown',e=>{ const t=e.target.closest('[role="tab"]'); if(!t) return; if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); const ks=Object.keys(TYPES); const i=ks.indexOf(t.dataset.tab); ctx.tab=ks[(i+(e.key==='ArrowRight'?1:ks.length-1))%ks.length]; render(false); document.getElementById('tab-'+ctx.tab).focus(); } });
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  if(f.dataset.form==='email'){ const v=$('#email').value.trim(); if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){ctx.email=v;ctx.err='Enter an email address like name@example.com';render();return;}
    ctx.email=v; ctx.code=String(Math.floor(100000+Math.random()*900000)); ctx.signStep='otp'; ctx.err=null; render(); }
  else if(f.dataset.form==='otp'){ const v=$('#otp').value.trim(); if(v!==ctx.code){ctx.err=v.length!==6?'Enter all 6 digits of the code':'That code doesn’t match. Check it and try again.';render();return;}
    S.user={email:ctx.email,verified:true}; persist(); toast('Signed in.'); const n=ctx.next||{}; if(n.start) startType(n.start,n.fresh); else go('home'); }
});
document.addEventListener('change',e=>{
  const t=e.target; const d=ctx.type?S.drafts[ctx.type]:null;
  if(t.matches('[data-upload]')){ handleUpload(t); return; }
  if(!d) return;
  if(t.dataset.q){ const s=TYPES[d.type].sections.find(x=>x.id===t.dataset.q); d.answers[s.id][+t.dataset.qi]=+t.value; const c=$(`#c-${s.id}-${t.dataset.qi}`); if(c) c.textContent=SCALES[+t.dataset.qi].opts[+t.value][1]; d.updatedAt=Date.now(); persist(); clearErr(t.name); }
  else if(t.dataset.ev){ const arr=d.evidence[t.dataset.ev]; if(t.checked){if(!arr.includes(t.value))arr.push(t.value);} else arr.splice(arr.indexOf(t.value),1); persist(); }
  else if(t.dataset.gate!=null){ d.gates[+t.dataset.gate]=t.value; persist(); const y=scrollY; render(false); scrollTo(0,y); const el=document.getElementById(t.id); if(el) el.focus(); }
  else if(t.dataset.profile){ d.profile[t.dataset.profile]=t.value; persist(); }
});
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset.profile&&ctx.type){ S.drafts[ctx.type].profile[t.dataset.profile]=t.value; persist(); } });
function clearErr(name){ const fs=document.getElementById(name); if(fs){const p=fs.querySelector('.err');if(p)p.remove();} }
$('#themeBtn').addEventListener('click',()=>{S.theme=isDark()?'light':'dark';persist();render(false);});

/* ========== Start ========== */
$('#logo').src=LOGO;
loadLocal();
const h=(location.hash||'').slice(1); if(['home','reports','privacy'].includes(h)) view=h;
render(false);
initCaps();
</script>
